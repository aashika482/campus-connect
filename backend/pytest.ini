[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole run: the app's database engine is shared across tests
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# python-jose (a dependency) still calls datetime.utcnow(); nothing to fix on our side
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:jose
